<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel-Integração de Segurança</title>

    <link rel="stylesheet" href="../style.css">

    <style>
    /* =========================================
       VISUAL DO PAINEL RH
       ========================================= */

    * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "SF Pro Text", "Segoe UI", Arial, sans-serif;

    background:
        radial-gradient(circle at top left, rgba(16,185,129,.08), transparent 35%),
        #f2f4f7;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    color: #1e293b;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;

    animation: pageFadeIn .7s ease-out both;
}


/* =====================================================
   PAINEL
   ===================================================== */

.painel {
    width: 100%;
    max-width: 500px;

    background: rgba(255,255,255,.94);

    padding: 35px;

    border-radius: 18px;

    border: 1px solid rgba(255,255,255,.8);

    box-shadow:
        0 20px 50px rgba(15,23,42,.08),
        0 4px 15px rgba(15,23,42,.04);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    animation: painelEntrada .8s cubic-bezier(.22,1,.36,1) both;

    transition:
        transform .35s cubic-bezier(.22,1,.36,1),
        box-shadow .35s cubic-bezier(.22,1,.36,1);
}

.painel:hover {
    transform: translateY(-2px);

    box-shadow:
        0 25px 60px rgba(15,23,42,.10),
        0 6px 20px rgba(15,23,42,.05);
}


/* =====================================================
   TÍTULOS
   ===================================================== */

h1 {
    text-align: center;

    margin-top: 0;
    margin-bottom: 10px;

    color: #064e3b;

    letter-spacing: -.4px;

    animation: conteudoEntrada .7s cubic-bezier(.22,1,.36,1) .12s both;
}

.subtitulo {
    text-align: center;

    color: #64748b;

    margin-bottom: 30px;

    animation: conteudoEntrada .7s cubic-bezier(.22,1,.36,1) .2s both;
}


/* =====================================================
   LABELS
   ===================================================== */

label {
    display: block;

    margin-bottom: 7px;

    font-weight: 600;

    color: #334155;

    transition:
        color .25s ease,
        transform .25s ease;
}


/* =====================================================
   INPUTS
   ===================================================== */

input {
    width: 100%;

    padding: 14px 15px;

    margin-bottom: 18px;

    border: 1px solid #d7dee7;

    border-radius: 10px;

    background: #ffffff;

    color: #1e293b;

    font-family: inherit;
    font-size: 16px;

    outline: none;

    box-shadow:
        0 1px 2px rgba(15,23,42,.03);

    transition:
        border-color .25s cubic-bezier(.22,1,.36,1),
        box-shadow .25s cubic-bezier(.22,1,.36,1),
        transform .25s cubic-bezier(.22,1,.36,1),
        background-color .25s ease;
}

input::placeholder {
    color: #94a3b8;

    transition:
        opacity .2s ease,
        transform .2s ease;
}

input:hover {
    border-color: #b8c4d1;
}

input:focus {
    border-color: #10b981;

    background: #ffffff;

    box-shadow:
        0 0 0 4px rgba(16,185,129,.10),
        0 4px 12px rgba(15,23,42,.05);

    transform: translateY(-1px);
}

input:focus::placeholder {
    opacity: .45;
    transform: translateX(3px);
}


/* =====================================================
   LINHA
   ===================================================== */

hr {
    border: none;
    border-top: 1px solid #e2e8f0;

    margin: 25px 0;

    opacity: .8;
}


/* =====================================================
   BOTÃO
   ===================================================== */

button {
    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 10px;

    background: #10b981;

    color: white;

    font-family: inherit;
    font-size: 16px;
    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 4px 12px rgba(16,185,129,.20);

    transition:
        transform .25s cubic-bezier(.22,1,.36,1),
        box-shadow .25s cubic-bezier(.22,1,.36,1),
        background-color .25s ease,
        opacity .25s ease;
}

button:hover:not(:disabled) {
    background: #059669;

    transform: translateY(-2px);

    box-shadow:
        0 8px 18px rgba(16,185,129,.25);
}

button:active:not(:disabled) {
    transform: scale(.98);
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;

    box-shadow: none;
}


/* =====================================================
   MENSAGEM
   ===================================================== */


#mensagem-painel,
#mensagem-cadastro {
    margin-top: 20px;
    text-align: center;
    font-weight: 600;
    opacity: 0;
    transform: translateY(8px);
    transition:
        opacity .4s ease,
        transform .4s cubic-bezier(.22,1,.36,1);
}

#mensagem-painel:not(:empty),
#mensagem-cadastro:not(:empty) {
    opacity: 1;
    transform: translateY(0);
}


/* =====================================================
   ANIMAÇÕES
   ===================================================== */

@keyframes pageFadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes painelEntrada {
    from {
        opacity: 0;
        transform: translateY(25px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes conteudoEntrada {
    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


.modal-rh-overlay {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;

    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(4px);

    opacity: 0;
    animation: modalRhFadeIn 0.25s ease-out forwards;
}

.modal-rh-box {
    width: 100%;
    max-width: 420px;
    padding: 30px 26px;
    border-radius: 18px;
    background: #fff;
    text-align: center;
    box-shadow: 0 22px 65px rgba(0, 0, 0, 0.25);

    opacity: 0;
    transform: translateY(18px) scale(0.96);
    animation: modalRhEntrada 0.3s cubic-bezier(.2,.8,.2,1) forwards;
}

.modal-rh-overlay.fechando {
    pointer-events: none;
    animation: modalRhFadeOut 0.2s ease-in forwards;
}

.modal-rh-overlay.fechando .modal-rh-box {
    animation: modalRhSaida 0.2s ease-in forwards;
}

@keyframes modalRhFadeIn {
    to { opacity: 1; }
}

@keyframes modalRhEntrada {
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes modalRhFadeOut {
    to { opacity: 0; }
}

@keyframes modalRhSaida {
    to {
        opacity: 0;
        transform: translateY(10px) scale(0.97);
    }
}


/* =====================================================
   MOBILE — TRANSIÇÕES SUAVES
   ===================================================== */

@media (max-width: 768px) {

    body {
        padding: 14px;

        align-items: flex-start;

        padding-top: 25px;

        background:
            radial-gradient(circle at top, rgba(16,185,129,.08), transparent 40%),
            #f2f4f7;
    }

    .painel {
        width: 100%;

        padding: 26px 20px;

        border-radius: 16px;

        box-shadow:
            0 12px 35px rgba(15,23,42,.08);

        animation:
            painelMobileEntrada .7s cubic-bezier(.22,1,.36,1) both;
    }

    .painel:hover {
        transform: none;

        box-shadow:
            0 12px 35px rgba(15,23,42,.08);
    }

    h1 {
        font-size: 24px;
    }

    .subtitulo {
        font-size: 14px;

        margin-bottom: 25px;
    }

    label {
        font-size: 14px;
    }

    input {
        padding: 14px;

        min-height: 48px;

        font-size: 16px;

        border-radius: 10px;

        transition:
            border-color .25s ease,
            box-shadow .25s ease,
            transform .25s ease;
    }

    input:focus {
        transform: none;

        box-shadow:
            0 0 0 4px rgba(16,185,129,.10);
    }

    button {
        min-height: 50px;

        font-size: 15px;

        border-radius: 10px;

        transition:
            transform .18s cubic-bezier(.22,1,.36,1),
            background-color .25s ease,
            box-shadow .25s ease;
    }

    button:active:not(:disabled) {
        transform: scale(.97);
    }

    hr {
        margin: 22px 0;
    }
}

@keyframes painelMobileEntrada {
    from {
        opacity: 0;
        transform: translateY(18px) scale(.985);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


/* =====================================================
   REDUZIR MOVIMENTO — ACESSIBILIDADE
   ===================================================== */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
    }
}


/* Modal personalizado de confirmação do RH */

/* Modal personalizado do RH */

    opacity: 0;
    animation: modalRhFadeIn .18s ease-out forwards;

.modal-rh-icone {

.modal-rh-titulo {
    color: #064e3b;

.modal-rh-descricao {

.modal-rh-acoes {

}

.modal-rh-acoes button {
    flex: 1;

    min-width: 0;
    margin: 0;

    border: 0;
    border-radius: 9px;

    font-size: 14px;
    line-height: 1.3;
    text-align: center;
    font-weight: 700;
    cursor: pointer;
}

.modal-rh-cancelar {
    background: #e5e7eb;
    color: #374151;
}

.modal-rh-confirmar {
    background: #059669;

.modal-rh-confirmar.perigo {

}

    animation: modalRhFadeOut .16s ease-in forwards;

}

.modal-rh-overlay.fechando .modal-rh-box {

}

@keyframes modalRhFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes modalRhFadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
}

@keyframes modalRhSubir {
    from {
        opacity: 0;
        transform: translateY(8px) scale(.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes modalRhDescer {
    from {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
    to {
        opacity: 0;
        transform: translateY(5px) scale(.99);
    }
}



</style>

<body>

    <div class="painel">

        <h1>PAINEL DO ADMINISTRADOR</h1>

        <p class="subtitulo">
            Cadastro de colaboradores
        </p>

            <form id="form-admin">


        <label for="nome-colaborador">Nome completo</label>
        <input
            type="text"
            id="nome-colaborador"
            placeholder="Nome completo"
            required
        >

        <label for="data-admissao">Data de admissão</label>
        <input
             type="text"
            id="data-admissao"
            placeholder="DD/MM/AAAA"
            maxlength="10"
            inputmode="numeric"
            required
        >

        <label for="funcao-colaborador">Função</label>
        <input
            type="text"
            id="funcao-colaborador"
            placeholder="Função do colaborador"
            required
        >

        <label for="setor-colaborador">Setor</label>
        <input
            type="text"
            id="setor-colaborador"
            placeholder="Setor"
            required
        >

        <label for="whatsapp-colaborador">WhatsApp</label>
        <input
            type="tel"
            id="whatsapp-colaborador"
            placeholder="(18) 99999-9999"
            required
        >

        <button type="submit" id="btn-cadastrar">
            GERAR LINK DO TREINAMENTO
        </button>

        <div id="mensagem-cadastro"></div>

    </form>

   <hr style="margin: 25px 0; border: none; border-top: 1px solid #ddd;">

<div id="lista-colaboradores">
    <p style="text-align:center;color:#666;">
        Carregando colaboradores...
    </p>
</div>

    <script>

        const API = 'https://site-integracao-seguranca.onrender.com';

        let tokenAdmin = localStorage.getItem(
            'integracao_admin_token'
        );


        document
            .getElementById('form-admin')
            .addEventListener(
                'submit',
                cadastrarColaborador
            );


        async function entrarPainel() {

            const emailAdmin =
                document
                    .getElementById('email-admin')
                    .value
                    .trim();

            const senhaAdmin =
                document
                    .getElementById('senha-admin')
                    .value;

            const btn =
                document.getElementById('btn-carregar');

            const mensagem =
                document.getElementById('mensagem-painel');


            if (!emailAdmin || !senhaAdmin) {

                mensagem.textContent =
                    'Informe o e-mail e a senha do administrador.';

                mensagem.className = 'erro';

                return;
            }


            btn.disabled = true;

            btn.textContent = 'ENTRANDO...';

            mensagem.textContent = '';

            mensagem.className = '';


            try {

                const respostaLogin = await fetch(
                    `${API}/api/auth/login`,
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify({

                            email: emailAdmin,

                            senha: senhaAdmin

                        })
                    }
                );


                const dadosLogin =
                    await respostaLogin.json();


                if (!respostaLogin.ok) {

                    throw new Error(
                        dadosLogin.erro ||
                        'E-mail ou senha do administrador inválidos.'
                    );

                }


                if (
                    !dadosLogin.usuario ||
                    !['rh', 'admin'].includes(
                        dadosLogin.usuario.role
                    )
                ) {

                    throw new Error(
                        'Este usuário não possui permissão para acessar o painel RH.'
                    );
                }


                localStorage.setItem(
                    'integracao_admin_token',
                    dadosLogin.token
                );


                tokenAdmin =
                    dadosLogin.token;


                mensagem.textContent =
                    '✓ Acesso administrativo autorizado.';

                mensagem.className =
                    'sucesso';


                await carregarColaboradores();


                btn.textContent =
                    'ATUALIZAR COLABORADORES';


            } catch (erro) {

                console.error(
                    'Erro no acesso administrativo:',
                    erro
                );


                mensagem.textContent =
                    '❌ ' + erro.message;

                mensagem.className =
                    'erro';


                btn.textContent =
                    'ENTRAR NO PAINEL';

            } finally {

                btn.disabled = false;

            }

        }

    
async function cadastrarColaborador(event) {
    event.preventDefault();

    const nome = document.getElementById('nome-colaborador').value.trim();
    const dataDigitada = document.getElementById('data-admissao').value.trim();
    const funcao = document.getElementById('funcao-colaborador').value.trim();
    const setor = document.getElementById('setor-colaborador').value.trim();
    const whatsapp = document.getElementById('whatsapp-colaborador').value.trim();

    const btn = document.getElementById('btn-cadastrar');
    const mensagem = document.getElementById('mensagem-cadastro');

    mensagem.textContent = '';
    mensagem.className = '';

    if (!/^\d{2}\/\d{2}\/\d{4}$/.test(dataDigitada)) {
        mensagem.textContent = 'Informe a data no formato DD/MM/AAAA.';
        mensagem.className = 'erro';
        return;
    }

    const [dia, mes, ano] = dataDigitada.split('/');
    const data_admissao = `${ano}-${mes}-${dia}`;
    const dataTeste = new Date(`${data_admissao}T00:00:00`);

    if (
        dataTeste.getFullYear() !== Number(ano) ||
        dataTeste.getMonth() + 1 !== Number(mes) ||
        dataTeste.getDate() !== Number(dia)
    ) {
        mensagem.textContent = 'Informe uma data válida.';
        mensagem.className = 'erro';
        return;
    }

    btn.disabled = true;
    btn.textContent = 'CADASTRANDO...';

    try {
        const resposta = await fetch(`${API}/api/usuarios`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                nome,
                data_admissao,
                funcao,
                setor,
                whatsapp
            })
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
            throw new Error(
                dados.erro || 'Não foi possível cadastrar o colaborador.'
            );
        }

        if (!dados.link_treinamento) {
            throw new Error(
                'Cadastro realizado, mas o servidor não retornou o link do treinamento.'
            );
        }

        const link = dados.link_treinamento;
        const mensagemWhatsApp = encodeURIComponent(
            'Acesse seu treinamento de Integração de Segurança: ' + link
        );

        mensagem.innerHTML = `
            <strong>✓ COLABORADOR CADASTRADO!</strong>
            <br><br>
            Link do treinamento:
            <br>
            <a href="${link}" target="_blank" rel="noopener noreferrer"
               style="color:#047857;font-weight:700;word-break:break-all;">
                ${link}
            </a>
            <br><br>
            <button type="button" id="copiar-link">COPIAR LINK</button>
            <button type="button" id="enviar-whatsapp" style="margin-top:10px;">
                ENVIAR PELO WHATSAPP
            </button>
        `;

        mensagem.className = 'sucesso';

        document.getElementById('copiar-link').onclick = async () => {
            await navigator.clipboard.writeText(link);
        };

        document.getElementById('enviar-whatsapp').onclick = () => {
            window.open(
                `https://wa.me/?text=${mensagemWhatsApp}`,
                '_blank'
            );
        };

        document.getElementById('form-admin').reset();

        await carregarColaboradores();

    } catch (erro) {
        console.error('Erro no cadastro:', erro);
        mensagem.textContent = '❌ ' + erro.message;
        mensagem.className = 'erro';

    } finally {
        btn.disabled = false;
        btn.textContent = 'GERAR LINK DO TREINAMENTO';
    }
}


// ==========================================
// CARREGAR COLABORADORES
// ==========================================

async function carregarColaboradores() {
    const lista = document.getElementById('lista-colaboradores');

    if (!lista) return;

    const token = localStorage.getItem('integracao_admin_token');

    if (!token) {
        lista.innerHTML = '<p>Cadastro realizado. A listagem exige autenticação do RH.</p>';
        return;
    }

    lista.innerHTML = '<p>Carregando colaboradores...</p>';

    try {
        const resposta = await fetch(`${API}/api/rh/usuarios`, {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
            throw new Error(
                dados.erro || 'Erro ao carregar colaboradores.'
            );
        }

        const colaboradores = dados.usuarios || [];

        if (colaboradores.length === 0) {
            lista.innerHTML = '<p>Nenhum colaborador cadastrado.</p>';
            return;
        }

        lista.innerHTML = colaboradores.map(usuario => {
            const status = usuario.ativo ? 'ATIVO' : 'DESATIVADO';

            const treinamento = usuario.treinamento_concluido
                ? 'CONCLUÍDO'
                : 'EM ANDAMENTO';

            const moduloAtual = Number(
                usuario.ultimo_modulo ?? usuario.modulo_atual ?? 0
            );

            const progresso = usuario.treinamento_concluido
                ? 100
                : Math.min(
                    99,
                    Math.max(0, Math.round((moduloAtual / 12) * 100))
                );

            const botaoTexto = usuario.ativo ? 'DESATIVAR' : 'ATIVAR';

            return `
                <div class="colaborador-card">
                    <h3>${usuario.nome}</h3>

                    <p><strong>Admissão:</strong> ${usuario.data_admissao || 'Não informada'}</p>
                    <p><strong>Função:</strong> ${usuario.funcao || 'Não informada'}</p>
                    <p><strong>Setor:</strong> ${usuario.setor || 'Não informado'}</p>
                    <p><strong>WhatsApp:</strong> ${usuario.whatsapp || 'Não informado'}</p>
                    <p><strong>Status:</strong> ${status}</p>
                    <p><strong>Treinamento:</strong> ${treinamento}</p>
                    <p><strong>Progresso:</strong> ${progresso}%</p>

                    <button
                        type="button"
                        onclick="alterarStatusUsuario(${usuario.id}, ${!usuario.ativo})"
                    >
                        ${botaoTexto}
                    </button>

                    ${!usuario.ativo ? `
                        <button
                            type="button"
                            onclick="excluirColaborador(${usuario.id})"
                            style="margin-top:10px;background:#dc2626;"
                        >
                            EXCLUIR COLABORADOR
                        </button>
                    ` : ''}

                    <button
                        type="button"
                        onclick="resetarTreinamento(${usuario.id})"
                        style="margin-top:10px;background:#f28c28;"
                    >
                        RESETAR TREINAMENTO
                    </button>
                </div>
            `;
        }).join('');

    } catch (erro) {
        console.error('Erro ao carregar colaboradores:', erro);
        lista.innerHTML = `
            <p style="color:red;">${erro.message}</p>
        `;
    }
}
        

function confirmarAcaoRH(titulo, descricao, textoBotao, perigo = false) {
    return new Promise((resolve) => {
        const anterior = document.getElementById('modal-confirm-rh');
        if (anterior) anterior.remove();

        const overlay = document.createElement('div');
        overlay.id = 'modal-confirm-rh';
        overlay.className = 'modal-rh-overlay';

        overlay.innerHTML = `
            <div class="modal-rh-box" role="dialog" aria-modal="true">
                <div class="modal-rh-icone">⚠️</div>
                <h3 class="modal-rh-titulo"></h3>
                <p class="modal-rh-descricao"></p>
                <div class="modal-rh-acoes">
                    <button type="button" class="modal-rh-cancelar">
                        Cancelar
                    </button>
                    <button type="button" class="modal-rh-confirmar"></button>
                </div>
            </div>
        `;

        overlay.querySelector('.modal-rh-titulo').textContent = titulo;
        overlay.querySelector('.modal-rh-descricao').textContent = descricao;

        const btnCancelar = overlay.querySelector('.modal-rh-cancelar');
        const btnConfirmar = overlay.querySelector('.modal-rh-confirmar');

        btnConfirmar.textContent = textoBotao;

        if (perigo) {
            btnConfirmar.classList.add('perigo');
        }

        let finalizado = false;

        function finalizar(resultado) {
            if (finalizado) return;
            finalizado = true;

            document.removeEventListener('keydown', aoPressionarTecla);
            overlay.classList.add('fechando');

            setTimeout(() => {
                overlay.remove();
                resolve(resultado);
            }, 170);
        }

        function aoPressionarTecla(evento) {
            if (evento.key === 'Escape') finalizar(false);
        }

        btnCancelar.addEventListener('click', () => finalizar(false));
        btnConfirmar.addEventListener('click', () => finalizar(true));

        overlay.addEventListener('click', (evento) => {
            if (evento.target === overlay) finalizar(false);
        });

        document.addEventListener('keydown', aoPressionarTecla);
        document.body.appendChild(overlay);
    });
}


function mostrarMensagemRH(titulo, descricao, tipo = 'sucesso') {
    return new Promise((resolve) => {
        const anterior = document.getElementById('modal-confirm-rh');
        if (anterior) anterior.remove();

        const overlay = document.createElement('div');
        overlay.id = 'modal-confirm-rh';
        overlay.className = 'modal-rh-overlay';

        const icone = tipo === 'erro' ? '❌' : '✅';

        overlay.innerHTML = `
            <div class="modal-rh-box" role="dialog" aria-modal="true">
                <div class="modal-rh-icone"></div>
                <h3 class="modal-rh-titulo"></h3>
                <p class="modal-rh-descricao"></p>
                <div class="modal-rh-acoes">
                    <button type="button" class="modal-rh-confirmar">
                        ENTENDI
                    </button>
                </div>
            </div>
        `;

        overlay.querySelector('.modal-rh-icone').textContent = icone;
        overlay.querySelector('.modal-rh-titulo').textContent = titulo;
        overlay.querySelector('.modal-rh-descricao').textContent = descricao;

        const botao = overlay.querySelector('.modal-rh-confirmar');

        if (tipo === 'erro') {
            botao.classList.add('perigo');
        }

        let finalizado = false;

        function fechar() {
            if (finalizado) return;
            finalizado = true;

            document.removeEventListener('keydown', aoPressionarTecla);
            overlay.classList.add('fechando');

            setTimeout(() => {
                overlay.remove();
                resolve();
            }, 170);
        }

        function aoPressionarTecla(evento) {
            if (evento.key === 'Escape') fechar();
        }

        botao.addEventListener('click', fechar);

        overlay.addEventListener('click', (evento) => {
            if (evento.target === overlay) fechar();
        });

        document.addEventListener('keydown', aoPressionarTecla);
        document.body.appendChild(overlay);
        botao.focus();
    });
}


        
async function alterarStatusUsuario(id, novoStatus) {
    const token =
        tokenAdmin ||
        localStorage.getItem('integracao_admin_token');

    if (!token) {
        alert('Sessão administrativa não encontrada.');
        return;
    }

    const confirmou = await confirmarAcaoRH(
        novoStatus ? 'Ativar colaborador?' : 'Desativar colaborador?',
        novoStatus
            ? 'Deseja realmente reativar este colaborador?'
            : 'Deseja realmente desativar este colaborador?',
        novoStatus ? 'Sim, Ativar' : 'Sim, Desativar'
    );

    if (!confirmou) return;

    try {
        const resposta = await fetch(`${API}/api/usuarios`, {
    method: 'POST',
    headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${tokenAdmin}`
    },
    body: JSON.stringify({
        nome,
        data_admissao,
        funcao,
        setor,
        whatsapp
    })
});

        const dados = await resposta.json();

        if (!resposta.ok) {

            );

        await mostrarMensagemRH(

            )
        );

        await carregarColaboradores();

    } catch (erro) {

        alert(erro.message);
    }
}
       

        
async function resetarTreinamento(id) {
    const token = localStorage.getItem('integracao_admin_token');

    if (!token) {
        alert('Sessão do RH não encontrada. Faça login novamente.');
        return;
    }

    const confirmou = await confirmarAcaoRH(
        'Resetar treinamento?',
        'O progresso deste colaborador será reiniciado. Deseja continuar?',
        'Sim, Resetar',
        true
    );

    if (!confirmou) return;

    try {
        const resposta = await fetch(
            `${API}/api/rh/usuarios/${id}/resetar-treinamento`,
            {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            }
        );

        const dados = await resposta.json();

        if (!resposta.ok) {
            throw new Error(dados.erro || 'Não foi possível resetar o treinamento.');
        }

        await mostrarMensagemRH('Treinamento reiniciado com sucesso!');
        await carregarColaboradores();

    } catch (erro) {
        console.error('Erro ao resetar treinamento:', erro);
        alert(erro.message);
    } 

}

async function excluirColaborador(id) {
    const token = localStorage.getItem('integracao_admin_token');

    if (!token) {
        alert('Sessão administrativa não encontrada.');
        return;
    }

    const confirmou = await confirmarAcaoRH(
        'Excluir colaborador?',
        'Esta exclusão é definitiva e não poderá ser desfeita. Deseja continuar?',
        'Sim, Excluir',
        true
    );

    if (!confirmou) return;

    try {
        const resposta = await fetch(`${API}/api/usuarios/${id}`, {
            method: 'DELETE',
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
            throw new Error(dados.erro || 'Erro ao excluir colaborador.');
        }

        await mostrarMensagemRH(
            'Colaborador excluído!',
            dados.mensagem || 'O colaborador foi excluído com sucesso.'
    );

        await carregarColaboradores();

    } catch (erro) {
        console.error('Erro ao excluir colaborador:', erro);
        alert(erro.message);
    }
}

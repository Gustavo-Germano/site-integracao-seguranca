<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Integração de Segurança</title>

    <link rel="stylesheet" href="../style.css">

    <style>
    /* =========================================
       VISUAL DO PAINEL RH
       ========================================= */

    body {
        background: #f1f5f9;
        color: #334155;
        min-height: 100vh;
        font-family: 'Segoe UI', system-ui, sans-serif;
        padding: 40px 20px 80px;
    }

    .painel {
        width: 100%;
        max-width: 850px;
        margin: 0 auto;

        background: #ffffff;

        border: 1px solid #e2e8f0;
        border-radius: 16px;

        padding: 40px;

        box-shadow:
            0 4px 20px rgba(0, 0, 0, 0.06);
    }

    /* Título */

    .painel h1 {
        color: #064e3b;
        text-align: center;

        font-size: 28px;
        font-weight: 700;

        margin: 0 0 8px;
    }

    .subtitulo {
        text-align: center;

        color: #64748b;

        font-size: 15px;

        margin: 0 0 35px;
    }

    /* Labels */

    .painel label {
        display: block;

        color: #334155;

        font-size: 14px;
        font-weight: 600;

        margin: 0 0 7px;
    }

    /* Campos */

    .painel input {
        width: 100%;

        padding: 13px 14px;

        border: 2px solid #e2e8f0;
        border-radius: 8px;

        background: #ffffff;

        color: #334155;

        font-size: 15px;

        outline: none;

        margin-bottom: 18px;

        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease;
    }

    .painel input:focus {
        border-color: #10b981;

        box-shadow:
            0 0 0 3px rgba(16, 185, 129, 0.10);
    }

    .painel input::placeholder {
        color: #94a3b8;
    }

    /* Separadores */

    .painel hr {
        border: none !important;
        border-top: 1px solid #e2e8f0 !important;

        margin: 28px 0 !important;
    }

    /* Botões */

    .painel button {
        width: 100%;

        padding: 13px 20px;

        border: none;
        border-radius: 8px;

        background: #10b981;
        color: #ffffff;

        font-size: 14px;
        font-weight: 700;

        cursor: pointer;

        transition:
            transform 0.2s ease,
            background 0.2s ease,
            box-shadow 0.2s ease;
    }

    .painel button:hover:not(:disabled) {
        background: #059669;

        transform: translateY(-2px);

        box-shadow:
            0 5px 14px rgba(0, 0, 0, 0.12);
    }

    .painel button:active:not(:disabled) {
        transform: translateY(0);
    }

    .painel button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    /* Mensagens */

    #mensagem {
        margin-top: 18px;

        text-align: center;

        font-size: 14px;
        font-weight: 600;

        min-height: 20px;
    }

    #mensagem.sucesso {
        color: #059669;
    }

    #mensagem.erro {
        color: #dc2626;
    }

    /* Título da lista */

    .painel h2 {
        color: #064e3b;

        font-size: 21px;

        text-align: center;

        margin: 0 0 18px;
    }

    /* =========================================
       CARDS DOS COLABORADORES
       ========================================= */

    .colaborador-card {
        background: #f8fafc;

        border: 1px solid #e2e8f0;
        border-left: 4px solid #10b981;

        border-radius: 12px;

        padding: 22px;

        margin-bottom: 16px;

        box-shadow:
            0 2px 8px rgba(0, 0, 0, 0.04);

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease;
    }

    .colaborador-card:hover {
        transform: translateY(-2px);

        box-shadow:
            0 6px 16px rgba(0, 0, 0, 0.07);
    }

    .colaborador-card h3 {
        color: #064e3b;

        font-size: 18px;

        margin: 0 0 14px;

        text-align: left;
    }

    .colaborador-card p {
        text-indent: 0;

        color: #475569;

        font-size: 14px;

        line-height: 1.5;

        margin: 7px 0;
    }

    .colaborador-card strong {
        color: #334155;
    }

    /* Botão dentro do card */

    .colaborador-card button {
        margin-top: 8px;
    }

    /* =========================================
       RESPONSIVO
       ========================================= */

    @media (max-width: 768px) {

        body {
            padding: 20px 12px 70px;
        }

        .painel {
            padding: 25px 18px;

            border-radius: 12px;
        }

        .painel h1 {
            font-size: 23px;
        }

        .subtitulo {
            font-size: 14px;

            margin-bottom: 28px;
        }

        .colaborador-card {
            padding: 18px;
        }

        .colaborador-card h3 {
            font-size: 17px;
        }

        .colaborador-card p {
            font-size: 13px;
        }
    }
</style>

</head>

<body>

    <div class="painel">

        <h1>PAINEL DO RH</h1>

        <p class="subtitulo">
            Cadastro de colaboradores
        </p>

        <form id="form-admin">

            <label for="email-admin">
                E-mail do administrador
            </label>

            <input
                type="email"
                id="email-admin"
                placeholder="admin@email.com"
                required
            >

            <label for="senha-admin">
                Senha do administrador
            </label>

            <input
                type="password"
                id="senha-admin"
                placeholder="Senha"
                required
            >

            <hr style="margin: 25px 0; border: none; border-top: 1px solid #ddd;">

            <label for="nome-colaborador">
                Nome do colaborador
            </label>

            <input
                type="text"
                id="nome-colaborador"
                placeholder="Nome completo"
                required
            >

            <label for="email-colaborador">
                E-mail do colaborador
            </label>

            <input
                type="email"
                id="email-colaborador"
                placeholder="colaborador@email.com"
                required
            >

            <label for="senha-colaborador">
                Senha do colaborador
            </label>

            <input
                type="password"
                id="senha-colaborador"
                placeholder="Crie uma senha"
                required
            >

            <button type="submit" id="btn-cadastrar">
                CADASTRAR COLABORADOR
            </button>

        </form>

        <div id="mensagem"></div>

        <hr style="margin: 25px 0; border: none; border-top: 1px solid #ddd;">

        <h2 style="text-align: center; margin: 0 0 15px;">
            COLABORADORES
        </h2>

        <button
            type="button"
            id="btn-carregar"
            onclick="entrarPainel()"
            style="margin-bottom: 20px;"
        >
            ENTRAR NO PAINEL
        </button>

        <div id="lista-colaboradores">
            <p style="text-align: center; color: #666;">
                Entre no painel para visualizar os colaboradores.
            </p>
        </div>

    </div>

    <script>

        const API = 'https://site-integracao-seguranca.onrender.com';

        let tokenAdmin = localStorage.getItem(
            'integracao_admin_token'
        );


        document
            .getElementById('form-admin')
            .addEventListener(
                'submit',
                cadastrarColaborador
            );


        async function entrarPainel() {

            const emailAdmin =
                document
                    .getElementById('email-admin')
                    .value
                    .trim();

            const senhaAdmin =
                document
                    .getElementById('senha-admin')
                    .value;

            const btn =
                document.getElementById('btn-carregar');

            const mensagem =
                document.getElementById('mensagem');


            if (!emailAdmin || !senhaAdmin) {

                mensagem.textContent =
                    'Informe o e-mail e a senha do administrador.';

                mensagem.className = 'erro';

                return;
            }


            btn.disabled = true;

            btn.textContent = 'ENTRANDO...';

            mensagem.textContent = '';

            mensagem.className = '';


            try {

                const respostaLogin = await fetch(
                    `${API}/api/auth/login`,
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify({

                            email: emailAdmin,

                            senha: senhaAdmin

                        })
                    }
                );


                const dadosLogin =
                    await respostaLogin.json();


                if (!respostaLogin.ok) {

                    throw new Error(
                        dadosLogin.erro ||
                        'E-mail ou senha do administrador inválidos.'
                    );

                }


                if (
                    !dadosLogin.usuario ||
                    dadosLogin.usuario.perfil !== 'admin'
                ) {

                    throw new Error(
                        'Este usuário não possui permissão de administrador.'
                    );

                }


                localStorage.setItem(
                    'integracao_admin_token',
                    dadosLogin.token
                );


                tokenAdmin =
                    dadosLogin.token;


                mensagem.textContent =
                    '✓ Acesso administrativo autorizado.';

                mensagem.className =
                    'sucesso';


                await carregarColaboradores();


                btn.textContent =
                    'ATUALIZAR COLABORADORES';


            } catch (erro) {

                console.error(
                    'Erro no acesso administrativo:',
                    erro
                );


                mensagem.textContent =
                    '❌ ' + erro.message;

                mensagem.className =
                    'erro';


                btn.textContent =
                    'ENTRAR NO PAINEL';

            } finally {

                btn.disabled = false;

            }

        }


        async function cadastrarColaborador(event) {

            event.preventDefault();


            const emailAdmin =
                document
                    .getElementById('email-admin')
                    .value
                    .trim();


            const senhaAdmin =
                document
                    .getElementById('senha-admin')
                    .value;


            const nomeColaborador =
                document
                    .getElementById('nome-colaborador')
                    .value
                    .trim();


            const emailColaborador =
                document
                    .getElementById('email-colaborador')
                    .value
                    .trim();


            const senhaColaborador =
                document
                    .getElementById('senha-colaborador')
                    .value;


            const btn =
                document.getElementById(
                    'btn-cadastrar'
                );


            const mensagem =
                document.getElementById(
                    'mensagem'
                );


            mensagem.textContent = '';

            mensagem.className = '';


            btn.disabled = true;

            btn.textContent =
                'AUTENTICANDO...';


            try {

                /*
                 * ==========================================
                 * 1. LOGIN DO ADMINISTRADOR
                 * ==========================================
                 */

                const respostaLogin =
                    await fetch(
                        `${API}/api/auth/login`,
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body: JSON.stringify({

                                email:
                                    emailAdmin,

                                senha:
                                    senhaAdmin

                            })
                        }
                    );


                const dadosLogin =
                    await respostaLogin.json();


                if (!respostaLogin.ok) {

                    throw new Error(
                        dadosLogin.erro ||
                        'E-mail ou senha do administrador inválidos.'
                    );

                }


                /*
                 * ==========================================
                 * 2. CONFIRMA SE É ADMIN
                 * ==========================================
                 */

                if (
                    dadosLogin.usuario.perfil !==
                    'admin'
                ) {

                    throw new Error(
                        'Este usuário não possui permissão de administrador.'
                    );

                }


                /*
                 * ==========================================
                 * 3. PEGA O TOKEN
                 * ==========================================
                 */

                const token =
                    dadosLogin.token;


                tokenAdmin =
                    token;


                btn.textContent =
                    'CADASTRANDO...';


                /*
                 * ==========================================
                 * 4. CADASTRA O COLABORADOR
                 * ==========================================
                 */

                const respostaCadastro =
                    await fetch(
                        `${API}/api/usuarios`,
                        {
                            method: 'POST',

                            headers: {

                                'Content-Type':
                                    'application/json',

                                'Authorization':
                                    `Bearer ${token}`

                            },

                            body: JSON.stringify({

                                nome:
                                    nomeColaborador,

                                email:
                                    emailColaborador,

                                senha:
                                    senhaColaborador,

                                perfil:
                                    'colaborador'

                            })
                        }
                    );


                const dadosCadastro =
                    await respostaCadastro.json();


                if (!respostaCadastro.ok) {

                    throw new Error(
                        dadosCadastro.erro ||
                        'Não foi possível cadastrar o colaborador.'
                    );

                }


                /*
                 * ==========================================
                 * 5. SUCESSO
                 * ==========================================
                 */

                mensagem.textContent =
                    '✓ Colaborador cadastrado com sucesso!';

                mensagem.className =
                    'sucesso';


                document.getElementById(
                    'nome-colaborador'
                ).value = '';


                document.getElementById(
                    'email-colaborador'
                ).value = '';


                document.getElementById(
                    'senha-colaborador'
                ).value = '';


                localStorage.setItem(
                    'integracao_admin_token',
                    token
                );


                await carregarColaboradores();


            } catch (erro) {

                console.error(
                    'Erro no cadastro:',
                    erro
                );


                mensagem.textContent =
                    '❌ ' + erro.message;


                mensagem.className =
                    'erro';


            } finally {

                btn.disabled = false;

                btn.textContent =
                    'CADASTRAR COLABORADOR';

            }

        }


        async function carregarColaboradores() {

            const token =
                localStorage.getItem(
                    'integracao_admin_token'
                );


            if (!token) {

                return;

            }


            const lista =
                document.getElementById(
                    'lista-colaboradores'
                );


            lista.innerHTML =
                '<p>Carregando colaboradores...</p>';


            try {

                const resposta =
                    await fetch(
                        `${API}/api/usuarios`,
                        {
                            method: 'GET',

                            headers: {

                                'Authorization':
                                    `Bearer ${token}`

                            }
                        }
                    );


                const dados =
                    await resposta.json();


                if (!resposta.ok) {

                    throw new Error(
                        dados.erro ||
                        'Erro ao carregar colaboradores.'
                    );

                }


                const colaboradores =
                    dados.usuarios.filter(
                        usuario =>
                            usuario.perfil ===
                            'colaborador'
                    );


                if (
                    colaboradores.length === 0
                ) {

                    lista.innerHTML =
                        '<p>Nenhum colaborador cadastrado.</p>';

                    return;

                }


                lista.innerHTML =
                    colaboradores.map(
                        usuario => {

                            const status =
                                usuario.ativo
                                    ? 'ATIVO'
                                    : 'DESATIVADO';


                            const treinamento =
                                usuario.treinamento_concluido
                                    ? 'CONCLUÍDO'
                                    : 'EM ANDAMENTO';


                            const percentual =
                                usuario.treinamento_concluido
                                    ? 100
                                    : Math.round(
                                        (
                                            Number(
                                                usuario.ultimo_modulo
                                            ) / 12
                                        ) * 100
                                    );


                            const botaoTexto =
                                usuario.ativo
                                    ? 'DESATIVAR'
                                    : 'ATIVAR';


                            return `

                                <div class="colaborador-card">

                                    <h3>
                                        ${usuario.nome}
                                    </h3>

                                    <p>
                                        <strong>Email:</strong>
                                        ${usuario.email}
                                    </p>

                                    <p>
                                        <strong>Status:</strong>
                                        ${status}
                                    </p>

                                    <p>
                                        <strong>Treinamento:</strong>
                                        ${treinamento}
                                    </p>

                                    <p>
                                        <strong>Progresso:</strong>
                                        ${
                                            usuario.treinamento_concluido
                                                ? '12 de 12 módulos'
                                                : `${usuario.ultimo_modulo} de 12 módulos`
                                        }
                                    </p>


                                    <div style="
                                        width: 100%;
                                        height: 10px;
                                        background: #e0e0e0;
                                        border-radius: 10px;
                                        overflow: hidden;
                                        margin: 8px 0 18px;
                                    ">

                                        <div style="
                                            width: ${percentual}%;
                                            height: 100%;
                                            background: #1f6feb;
                                            border-radius: 10px;
                                        "></div>

                                    </div>


                                    <p style="
                                        text-align:center;
                                        margin-top:-10px;
                                    ">

                                        ${percentual}%

                                    </p>


                                    <button
                                        onclick="
                                            alterarStatusUsuario(
                                                ${usuario.id},
                                                ${!usuario.ativo}
                                            )
                                        "
                                    >

                                        ${botaoTexto}

                                    </button>

                                </div>

                            `;

                        }
                    ).join('');


            } catch (erro) {

                console.error(
                    'Erro:',
                    erro
                );


                lista.innerHTML = `

                    <p style="color:red;">

                        ${erro.message}

                    </p>

                `;

            }

        }


        async function alterarStatusUsuario(
            id,
            novoStatus
        ) {

            const token =
                tokenAdmin ||
                localStorage.getItem(
                    'integracao_admin_token'
                );


            if (!token) {

                alert(
                    'Sessão administrativa não encontrada.'
                );

                return;

            }


            const acao =
                novoStatus
                    ? 'ativar'
                    : 'desativar';


            const confirmar =
                confirm(
                    `Deseja realmente ${acao} este colaborador?`
                );


            if (!confirmar) {

                return;

            }


            try {

                const resposta =
                    await fetch(
                        `${API}/api/usuarios/${id}/status`,
                        {
                            method: 'PATCH',

                            headers: {

                                'Content-Type':
                                    'application/json',

                                'Authorization':
                                    `Bearer ${token}`

                            },

                            body: JSON.stringify({

                                ativo:
                                    novoStatus

                            })
                        }
                    );


                const dados =
                    await resposta.json();


                if (!resposta.ok) {

                    throw new Error(
                        dados.erro ||
                        'Erro ao alterar status.'
                    );

                }


                alert(
                    dados.mensagem
                );


                carregarColaboradores();


            } catch (erro) {

                console.error(
                    'Erro:',
                    erro
                );


                alert(
                    erro.message
                );

            }

        }

    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel-Integração de Segurança</title>

    <link rel="stylesheet" href="../style.css">

    <style>
    /* =========================================
       VISUAL DO PAINEL RH
       ========================================= */

    * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "SF Pro Text", "Segoe UI", Arial, sans-serif;

    background:
        radial-gradient(circle at top left, rgba(16,185,129,.08), transparent 35%),
        #f2f4f7;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    color: #1e293b;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;

    animation: pageFadeIn .7s ease-out both;
}


/* =====================================================
   PAINEL
   ===================================================== */

.painel {
    width: 100%;
    max-width: 500px;

    background: rgba(255,255,255,.94);

    padding: 35px;

    border-radius: 18px;

    border: 1px solid rgba(255,255,255,.8);

    box-shadow:
        0 20px 50px rgba(15,23,42,.08),
        0 4px 15px rgba(15,23,42,.04);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    animation: painelEntrada .8s cubic-bezier(.22,1,.36,1) both;

    transition:
        transform .35s cubic-bezier(.22,1,.36,1),
        box-shadow .35s cubic-bezier(.22,1,.36,1);
}

.painel:hover {
    transform: translateY(-2px);

    box-shadow:
        0 25px 60px rgba(15,23,42,.10),
        0 6px 20px rgba(15,23,42,.05);
}


/* =====================================================
   TÍTULOS
   ===================================================== */

h1 {
    text-align: center;

    margin-top: 0;
    margin-bottom: 10px;

    color: #064e3b;

    letter-spacing: -.4px;

    animation: conteudoEntrada .7s cubic-bezier(.22,1,.36,1) .12s both;
}

.subtitulo {
    text-align: center;

    color: #64748b;

    margin-bottom: 30px;

    animation: conteudoEntrada .7s cubic-bezier(.22,1,.36,1) .2s both;
}


/* =====================================================
   LABELS
   ===================================================== */

label {
    display: block;

    margin-bottom: 7px;

    font-weight: 600;

    color: #334155;

    transition:
        color .25s ease,
        transform .25s ease;
}


/* =====================================================
   INPUTS
   ===================================================== */

input {
    width: 100%;

    padding: 14px 15px;

    margin-bottom: 18px;

    border: 1px solid #d7dee7;

    border-radius: 10px;

    background: #ffffff;

    color: #1e293b;

    font-family: inherit;
    font-size: 16px;

    outline: none;

    box-shadow:
        0 1px 2px rgba(15,23,42,.03);

    transition:
        border-color .25s cubic-bezier(.22,1,.36,1),
        box-shadow .25s cubic-bezier(.22,1,.36,1),
        transform .25s cubic-bezier(.22,1,.36,1),
        background-color .25s ease;
}

input::placeholder {
    color: #94a3b8;

    transition:
        opacity .2s ease,
        transform .2s ease;
}

input:hover {
    border-color: #b8c4d1;
}

input:focus {
    border-color: #10b981;

    background: #ffffff;

    box-shadow:
        0 0 0 4px rgba(16,185,129,.10),
        0 4px 12px rgba(15,23,42,.05);

    transform: translateY(-1px);
}

input:focus::placeholder {
    opacity: .45;
    transform: translateX(3px);
}


/* =====================================================
   LINHA
   ===================================================== */

hr {
    border: none;
    border-top: 1px solid #e2e8f0;

    margin: 25px 0;

    opacity: .8;
}


/* =====================================================
   BOTÃO
   ===================================================== */

button {
    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 10px;

    background: #10b981;

    color: white;

    font-family: inherit;
    font-size: 16px;
    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 4px 12px rgba(16,185,129,.20);

    transition:
        transform .25s cubic-bezier(.22,1,.36,1),
        box-shadow .25s cubic-bezier(.22,1,.36,1),
        background-color .25s ease,
        opacity .25s ease;
}

button:hover:not(:disabled) {
    background: #059669;

    transform: translateY(-2px);

    box-shadow:
        0 8px 18px rgba(16,185,129,.25);
}

button:active:not(:disabled) {
    transform: scale(.98);
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;

    box-shadow: none;
}


/* =====================================================
   MENSAGEM
   ===================================================== */

#mensagem {
    margin-top: 20px;

    text-align: center;

    font-weight: 600;

    opacity: 0;

    transform: translateY(8px);

    transition:
        opacity .4s ease,
        transform .4s cubic-bezier(.22,1,.36,1);
}

#mensagem:not(:empty) {
    opacity: 1;
    transform: translateY(0);
}

.erro {
    color: #dc2626;
}

.sucesso {
    color: #059669;
}


/* =====================================================
   ANIMAÇÕES
   ===================================================== */

@keyframes pageFadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes painelEntrada {
    from {
        opacity: 0;
        transform: translateY(25px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes conteudoEntrada {
    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =====================================================
   MOBILE — TRANSIÇÕES SUAVES
   ===================================================== */

@media (max-width: 768px) {

    body {
        padding: 14px;

        align-items: flex-start;

        padding-top: 25px;

        background:
            radial-gradient(circle at top, rgba(16,185,129,.08), transparent 40%),
            #f2f4f7;
    }

    .painel {
        width: 100%;

        padding: 26px 20px;

        border-radius: 16px;

        box-shadow:
            0 12px 35px rgba(15,23,42,.08);

        animation:
            painelMobileEntrada .7s cubic-bezier(.22,1,.36,1) both;
    }

    .painel:hover {
        transform: none;

        box-shadow:
            0 12px 35px rgba(15,23,42,.08);
    }

    h1 {
        font-size: 24px;
    }

    .subtitulo {
        font-size: 14px;

        margin-bottom: 25px;
    }

    label {
        font-size: 14px;
    }

    input {
        padding: 14px;

        min-height: 48px;

        font-size: 16px;

        border-radius: 10px;

        transition:
            border-color .25s ease,
            box-shadow .25s ease,
            transform .25s ease;
    }

    input:focus {
        transform: none;

        box-shadow:
            0 0 0 4px rgba(16,185,129,.10);
    }

    button {
        min-height: 50px;

        font-size: 15px;

        border-radius: 10px;

        transition:
            transform .18s cubic-bezier(.22,1,.36,1),
            background-color .25s ease,
            box-shadow .25s ease;
    }

    button:active:not(:disabled) {
        transform: scale(.97);
    }

    hr {
        margin: 22px 0;
    }
}

@keyframes painelMobileEntrada {
    from {
        opacity: 0;
        transform: translateY(18px) scale(.985);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


/* =====================================================
   REDUZIR MOVIMENTO — ACESSIBILIDADE
   ===================================================== */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
    }
}

</style>

</head>

<body>

    <div class="painel">

        <h1>PAINEL DO ADMINISTRADOR</h1>

        <p class="subtitulo">
            Cadastro de colaboradores
        </p>

        <form id="form-admin">

            <label for="email-admin">
                E-mail do administrador
            </label>

            <input
                type="email"
                id="email-admin"
                placeholder="admin@email.com"
                required
            >

            <label for="senha-admin">
                Senha do administrador
            </label>

            <input
                type="password"
                id="senha-admin"
                placeholder="Senha"
                required
            >

            <hr style="margin: 25px 0; border: none; border-top: 1px solid #ddd;">

            <label for="nome-colaborador">
                Nome do colaborador
            </label>

            <input
                type="text"
                id="nome-colaborador"
                placeholder="Nome completo"
                required
            >

            <label for="email-colaborador">
                E-mail do colaborador
            </label>

            <input
                type="email"
                id="email-colaborador"
                placeholder="colaborador@email.com"
                required
            >

            <button type="submit" id="btn-cadastrar">
                CADASTRAR COLABORADOR
            </button>

        </form>

        <div id="mensagem"></div>

        <hr style="margin: 25px 0; border: none; border-top: 1px solid #ddd;">

        <h2 style="text-align: center; margin: 0 0 15px;">
            COLABORADORES
        </h2>

        <button
            type="button"
            id="btn-carregar"
            onclick="entrarPainel()"
            style="margin-bottom: 20px;"
        >
            ENTRAR NO PAINEL
        </button>

        <div id="lista-colaboradores">
            <p style="text-align: center; color: #666;">
                Entre no painel para visualizar os colaboradores.
            </p>
        </div>

    </div>

    <script>

        const API = 'https://site-integracao-seguranca.onrender.com';

        let tokenAdmin = localStorage.getItem(
            'integracao_admin_token'
        );


        document
            .getElementById('form-admin')
            .addEventListener(
                'submit',
                cadastrarColaborador
            );


        async function entrarPainel() {

            const emailAdmin =
                document
                    .getElementById('email-admin')
                    .value
                    .trim();

            const senhaAdmin =
                document
                    .getElementById('senha-admin')
                    .value;

            const btn =
                document.getElementById('btn-carregar');

            const mensagem =
                document.getElementById('mensagem');


            if (!emailAdmin || !senhaAdmin) {

                mensagem.textContent =
                    'Informe o e-mail e a senha do administrador.';

                mensagem.className = 'erro';

                return;
            }


            btn.disabled = true;

            btn.textContent = 'ENTRANDO...';

            mensagem.textContent = '';

            mensagem.className = '';


            try {

                const respostaLogin = await fetch(
                    `${API}/api/auth/login`,
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify({

                            email: emailAdmin,

                            senha: senhaAdmin

                        })
                    }
                );


                const dadosLogin =
                    await respostaLogin.json();


                if (!respostaLogin.ok) {

                    throw new Error(
                        dadosLogin.erro ||
                        'E-mail ou senha do administrador inválidos.'
                    );

                }


                if (
                    !dadosLogin.usuario ||
                    !['rh', 'admin'].includes(
                        dadosLogin.usuario.role
                    )
                ) {

                    throw new Error(
                        'Este usuário não possui permissão para acessar o painel RH.'
                    );
                }


                localStorage.setItem(
                    'integracao_admin_token',
                    dadosLogin.token
                );


                tokenAdmin =
                    dadosLogin.token;


                mensagem.textContent =
                    '✓ Acesso administrativo autorizado.';

                mensagem.className =
                    'sucesso';


                await carregarColaboradores();


                btn.textContent =
                    'ATUALIZAR COLABORADORES';


            } catch (erro) {

                console.error(
                    'Erro no acesso administrativo:',
                    erro
                );


                mensagem.textContent =
                    '❌ ' + erro.message;

                mensagem.className =
                    'erro';


                btn.textContent =
                    'ENTRAR NO PAINEL';

            } finally {

                btn.disabled = false;

            }

        }

        async function cadastrarColaborador(event) {

    event.preventDefault();


    const emailAdmin =
        document
            .getElementById('email-admin')
            .value
            .trim();


    const senhaAdmin =
        document
            .getElementById('senha-admin')
            .value;


    const nomeColaborador =
        document
            .getElementById('nome-colaborador')
            .value
            .trim();


    const emailColaborador =
        document
            .getElementById('email-colaborador')
            .value
            .trim();


    const btn =
        document.getElementById(
            'btn-cadastrar'
        );


    const mensagem =
        document.getElementById(
            'mensagem'
        );


    mensagem.textContent = '';
    mensagem.className = '';


    btn.disabled = true;
    btn.textContent =
        'AUTENTICANDO...';


    try {

        /*
         * ==================================================
         * 1. LOGIN DO RH / ADMIN
         * ==================================================
         */

        const respostaLogin =
            await fetch(
                `${API}/api/auth/login`,
                {
                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body: JSON.stringify({
                        email: emailAdmin,
                        senha: senhaAdmin
                    })
                }
            );


        const dadosLogin =
            await respostaLogin.json();


        if (!respostaLogin.ok) {

            throw new Error(
                dadosLogin.erro ||
                'Email ou senha inválidos.'
            );

        }


        /*
         * ==================================================
         * 2. CONFIRMAR RH / ADMIN
         * ==================================================
         */

        if (
            !dadosLogin.usuario ||
            !['rh', 'admin'].includes(
                dadosLogin.usuario.role
            )
        ) {

            throw new Error(
                'Você não possui permissão para cadastrar colaboradores.'
            );

        }


        const token =
            dadosLogin.token;


        btn.textContent =
            'GERANDO ACESSO...';


        /*
         * ==================================================
         * 3. CADASTRAR COLABORADOR
         * ==================================================
         */

        const respostaCadastro =
            await fetch(
                `${API}/api/usuarios`,
                {
                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json',

                        'Authorization':
                            `Bearer ${token}`
                    },

                    body: JSON.stringify({

                        nome:
                            nomeColaborador,

                        email:
                            emailColaborador

                    })
                }
            );


        const dadosCadastro =
            await respostaCadastro.json();

        console.log("RESPOSTA DO CADASTRO:", dadosCadastro);


        if (!respostaCadastro.ok) {

            throw new Error(
                dadosCadastro.erro ||
                'Não foi possível cadastrar o colaborador.'
            );

        }


        /*
         * ==================================================
         * 4. MOSTRAR AS CREDENCIAIS GERADAS
         * ==================================================
         */

        const loginGerado =
            dadosCadastro
                .credenciais
                .usuario_login;


        const senhaGerada =
            dadosCadastro
                .credenciais
                .senha_temporaria;

        const linkTreinamento =
            dadosCadastro.link_treinamento;


        mensagem.innerHTML = `
            <strong>
                ✓ COLABORADOR CADASTRADO
            </strong>
        
            <br><br>
        
            Usuário:
            <strong>
                ${loginGerado}
            </strong>
        
            <br>
        
            Senha temporária:
            <strong>
                ${senhaGerada}
            </strong>
        
            <br><br>
        
            <strong>
                Link do treinamento:
            </strong>
        
            <br>
        
            <a
                href="${linkTreinamento}"
                target="_blank"
                rel="noopener noreferrer"
                style="
                    display: inline-block;
                    margin-top: 8px;
                    color: #047857;
                    font-weight: 700;
                    word-break: break-all;
                "
            >
                ${linkTreinamento}
            </a>
        
            <br><br>
        
            <small>
                Guarde essas credenciais.
                A senha não será exibida novamente.
            </small>
        `;


        mensagem.className =
            'sucesso';


        /*
         * Limpa somente os dados do colaborador.
         */
        document
            .getElementById(
                'nome-colaborador'
            )
            .value = '';


        document
            .getElementById(
                'email-colaborador'
            )
            .value = '';


        /*
         * Atualiza a lista.
         */
        await carregarColaboradores();


    } catch (erro) {

        console.error(
            'Erro no cadastro:',
            erro
        );


        mensagem.textContent =
            '❌ ' + erro.message;


        mensagem.className =
            'erro';


    } finally {

        btn.disabled = false;

        btn.textContent =
            'CADASTRAR COLABORADOR';

    }

}
        

        async function carregarColaboradores() {

            const token =
                localStorage.getItem(
                    'integracao_admin_token'
                );


            if (!token) {

                return;

            }


            const lista =
                document.getElementById(
                    'lista-colaboradores'
                );


            lista.innerHTML =
                '<p>Carregando colaboradores...</p>';


            try {

                const resposta = await fetch(
                    `${API}/api/rh/usuarios`,
                    {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    }
                );


                const dados =
                    await resposta.json();


                if (!resposta.ok) {

                    throw new Error(
                        dados.erro ||
                        'Erro ao carregar colaboradores.'
                    );

                }


                const colaboradores = dados.usuarios;


                if (
                    colaboradores.length === 0
                ) {

                    lista.innerHTML =
                        '<p>Nenhum colaborador cadastrado.</p>';

                    return;

                }


                lista.innerHTML =
                    colaboradores.map(
                        usuario => {

                            const status =
                                usuario.ativo
                                    ? 'ATIVO'
                                    : 'DESATIVADO';


                            const treinamento =
                                usuario.treinamento_concluido
                                    ? 'CONCLUÍDO'
                                    : 'EM ANDAMENTO';


                            const percentual =
                                usuario.treinamento_concluido
                                    ? 100
                                    : Math.round(
                                        (
                                            Number(
                                                usuario.ultimo_modulo
                                            ) / 12
                                        ) * 100
                                    );


                            const botaoTexto =
                                usuario.ativo
                                    ? 'DESATIVAR'
                                    : 'ATIVAR';


                            return `
                                <div class="colaborador-card">
                                
                                    <h3>${usuario.nome}</h3>
                                
                                    <p>
                                        <strong>Email:</strong>
                                        ${usuario.email}
                                    </p>
                                
                                    <p>
                                        <strong>Status:</strong>
                                        ${status}
                                    </p>
                                
                                    <p>
                                        <strong>Treinamento:</strong>
                                        ${treinamento}
                                    </p>
                                
                                    <button
                                        onclick="alterarStatusUsuario(
                                            ${usuario.id},
                                            ${!usuario.ativo}
                                        )"
                                    >
                                        ${botaoTexto}
                                    </button>
                                
                                    <button
                                        type="button"
                                        onclick="resetarTreinamento(${usuario.id})"
                                        style="
                                            margin-top: 10px;
                                            background: #f28c28;
                                        "
                                    >
                                        RESETAR TREINAMENTO
                                    </button>
                                
                                </div>
                            `;

                        }
                    ).join('');


            } catch (erro) {

                console.error(
                    'Erro:',
                    erro
                );


                lista.innerHTML = `

                    <p style="color:red;">

                        ${erro.message}

                    </p>

                `;

            }

        }


        async function alterarStatusUsuario(
            id,
            novoStatus
        ) {

            const token =
                tokenAdmin ||
                localStorage.getItem(
                    'integracao_admin_token'
                );


            if (!token) {

                alert(
                    'Sessão administrativa não encontrada.'
                );

                return;

            }


            const acao =
                novoStatus
                    ? 'ativar'
                    : 'desativar';


            const confirmar =
                confirm(
                    `Deseja realmente ${acao} este colaborador?`
                );


            if (!confirmar) {

                return;

            }


            try {

                const resposta =
                    await fetch(
                        `${API}/api/rh/usuarios/${id}/status`,
                        {
                            method: 'PATCH',

                            headers: {

                                'Content-Type':
                                    'application/json',

                                'Authorization':
                                    `Bearer ${token}`

                            },

                            body: JSON.stringify({

                                ativo:
                                    novoStatus

                            })
                        }
                    );


                const dados =
                    await resposta.json();


                if (!resposta.ok) {

                    throw new Error(
                        dados.erro ||
                        'Erro ao alterar status.'
                    );

                }


                alert(
                    dados.mensagem
                );


                carregarColaboradores();


            } catch (erro) {

                console.error(
                    'Erro:',
                    erro
                );


                alert(
                    erro.message
                );

            }

        }

        async function resetarTreinamento(id) {

    const token =
        localStorage.getItem(
            'integracao_admin_token'
        );

    if (!token) {

        alert(
            'Sessão administrativa não encontrada.'
        );

        return;
    }

    const confirmar = confirm(
        'Deseja realmente resetar o treinamento deste colaborador?'
    );

    if (!confirmar) {
        return;
    }

    try {

        const resposta = await fetch(
            `${API}/api/rh/usuarios`,
        {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${token}`
            }
        }
    );

        const dados =
            await resposta.json();

        if (!resposta.ok) {

            throw new Error(
                dados.erro ||
                'Erro ao resetar treinamento.'
            );

        }

        alert(
            dados.mensagem
        );

        await carregarColaboradores();

    } catch (erro) {

        console.error(
            'Erro ao resetar treinamento:',
            erro
        );

        alert(
            erro.message
        );

    }
}

    </script>

</body>
</html>
